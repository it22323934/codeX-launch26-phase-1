<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relic Ring Protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        background: #05060A;
        color: #DCEBFF;
        font-family: 'Orbitron', sans-serif;
      }
      #root { width: 100%; height: 100%; }

      /* HUD glass panel */
      .hud-panel {
        background: rgba(10, 14, 22, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(52, 227, 255, 0.2);
        box-shadow: 0 0 20px rgba(52, 227, 255, 0.08);
        position: relative;
      }
      .hud-panel::before,
      .hud-panel::after {
        content: '';
        position: absolute;
        width: 12px;
        height: 12px;
        border-color: #34E3FF;
        border-style: solid;
        pointer-events: none;
        z-index: 1;
      }
      .hud-panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
      .hud-panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

      /* Glitch text animation */
      @keyframes glitch {
        0%   { text-shadow: 1px 0 #34E3FF, -1px 0 #FF2D9B; }
        25%  { text-shadow: -2px 0 #34E3FF, 2px 0 #FF2D9B; }
        50%  { text-shadow: 1px 0 #FF2D9B, -1px 0 #34E3FF; }
        75%  { text-shadow: -1px 0 #34E3FF, 1px 0 #FF2D9B; }
        100% { text-shadow: 1px 0 #34E3FF, -1px 0 #FF2D9B; }
      }
      .glitch { animation: glitch 0.4s linear 1; }

      /* Monospace readout */
      .mono { font-family: 'JetBrains Mono', monospace; }

      /* Status colors */
      .status-active { color: #34E3FF; }
      .status-dead   { color: #FF2D9B; }
      .text-dim      { color: #6F8099; }

      /* Panel boot animation */
      @keyframes panel-boot {
        from { opacity: 0; transform: translateX(20px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .panel-boot {
        opacity: 0;
        animation: panel-boot 0.5s ease-out forwards;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #0A0E16; }
      ::-webkit-scrollbar-thumb { background: #3A4A63; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #34E3FF; }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .packet-anim, .radar-sweep, .glitch, .panel-boot {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
