[project]
name = "relic-ring-server"
version = "0.1.0"
description = "Relic Ring Protocol — interplanetary routing math engine + API (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",            # FastAPI TestClient transport
]

# Run the API with:  uvicorn app.main:app --reload   (from the server/ dir)
[project.scripts]
# (No console_scripts; invoke uvicorn directly per the prompt.)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]           # so `import app` / `import engine` resolve from server/

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "engine"]
